name: Release Stable Patch

on:
  workflow_dispatch:
    inputs:
      revision_id:
        description: Processed Neon game revision UUID to promote
        required: true
        type: string
      patch_version:
        description: Immutable stable tag, for example v3.2.0-r116-stable.1
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  legacy:
    uses: ./.github/workflows/fetch-legacy-data.yml
    secrets: inherit

  build-stable:
    needs: legacy
    uses: ./.github/workflows/build-patch.yml
    with:
      revision_id: ${{ inputs.revision_id }}
      patch_version: ${{ inputs.patch_version }}
      channel: stable
      legacy_run_id: ${{ needs.legacy.outputs.run_id }}
      legacy_artifact_name: ${{ needs.legacy.outputs.artifact_name }}
    secrets: inherit

  release-stable:
    needs: build-stable
    uses: ./.github/workflows/release-patch.yml
    with:
      build_run_id: ${{ github.run_id }}
      artifact_name: ${{ needs.build-stable.outputs.artifact_name }}
    secrets: inherit
