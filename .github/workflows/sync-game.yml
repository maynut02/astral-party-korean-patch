name: Sync Game

on:
  workflow_call:
    inputs:
      game_version:
        required: true
        type: string
      route_config:
        required: true
        type: string
    outputs:
      revision_id:
        value: ${{ jobs.sync.outputs.revision_id }}
      route:
        value: ${{ jobs.sync.outputs.route }}
      game_version:
        value: ${{ jobs.sync.outputs.game_version }}
      revision:
        value: ${{ jobs.sync.outputs.revision }}
      catalog_hash:
        value: ${{ jobs.sync.outputs.catalog_hash }}
  workflow_dispatch:
    inputs:
      game_version:
        description: Game version used by the hotaddress endpoint
        required: true
        default: "3.2.0"
        type: string
      route_config:
        description: Route configuration to synchronize
        required: true
        default: routes/int_steam.yaml
        type: choice
        options:
          - routes/int_steam.yaml
          - routes/cn_steam.yaml
          - routes/int_android.yaml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      revision_id: ${{ steps.sync.outputs.revision_id }}
      route: ${{ steps.sync.outputs.route }}
      game_version: ${{ steps.sync.outputs.game_version }}
      revision: ${{ steps.sync.outputs.revision }}
      catalog_hash: ${{ steps.sync.outputs.catalog_hash }}
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - name: Install builder
        run: python -m pip install -e './builder[dev]'
      - name: Apply database migrations
        run: python database/migrate.py
      - name: Sync route revision
        id: sync
        run: >-
          astral-builder sync
          --game-version '${{ inputs.game_version }}'
          --route-config '${{ inputs.route_config }}'
          --work-dir .work/sync
          --github-output "$GITHUB_OUTPUT"
