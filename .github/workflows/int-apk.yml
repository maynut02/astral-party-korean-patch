name: INT_APK

on:
  workflow_dispatch:

concurrency:
  group: int-apk-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_PACKAGE: com.feimo.astralpartyjpn
      APKEEP_IMAGE: ghcr.io/efforg/apkeep:stable
      PLAY_OPTIONS: locale=ja_JP,timezone=Asia/Tokyo,split_apk=1,include_additional_files=true
      LSPATCH_VERSION: v0.8
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          python -m pip install -e './builder[dev]'

          mkdir -p .work/android-tools
          curl --fail --location --retry 3 \
            --output .work/android-tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          cat > .work/android-tools/apktool <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec java -jar "$(dirname "$0")/apktool.jar" "$@"
          SCRIPT
          chmod +x .work/android-tools/apktool
          echo "$PWD/.work/android-tools" >> "$GITHUB_PATH"

          curl --fail --location --retry 3 \
            --output .work/android-tools/APKEditor.jar \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
          curl --fail --location --retry 3 \
            --output .work/android-tools/lspatch.jar \
            "https://github.com/JingMatrix/LSPatch/releases/download/$LSPATCH_VERSION/lspatch.jar"
          java -jar .work/android-tools/lspatch.jar --help > .work/android-tools/lspatch-help.txt
          grep -Fq -- '--sigbypasslv' .work/android-tools/lspatch-help.txt
          grep -Fq -- '--keystore' .work/android-tools/lspatch-help.txt

      - name: Validate secrets
        shell: bash
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          AAS_TOKEN: ${{ secrets.AAS_TOKEN }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PLAY_EMAIL"
          test -n "$AAS_TOKEN"
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Download current game from Google Play
        shell: bash
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          AAS_TOKEN: ${{ secrets.AAS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .work/google-play
          docker pull "$APKEEP_IMAGE"
          set +e
          docker run --rm \
            -v "$PWD/.work/google-play:/output" \
            "$APKEEP_IMAGE" \
            -a "$ANDROID_PACKAGE" \
            -d google-play \
            -o "$PLAY_OPTIONS" \
            -e "$PLAY_EMAIL" \
            -t "$AAS_TOKEN" \
            /output 2>&1 | tee .work/apkeep.log
          APKEEP_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$APKEEP_STATUS" -ne 0 ]; then
            echo "apkeep exited with status $APKEEP_STATUS" >&2
            exit "$APKEEP_STATUS"
          fi

          echo "Downloaded Google Play files:"
          find .work/google-play -type f -printf '%P\n' | sort

          mapfile -d '' DOWNLOADED_APKS < <(find .work/google-play -type f -name '*.apk' -print0)
          if [ "${#DOWNLOADED_APKS[@]}" -eq 0 ]; then
            if grep -Fq "Invalid app response" .work/apkeep.log; then
              echo "Google Play returned an invalid app response for $ANDROID_PACKAGE." >&2
              echo "The PLAY_EMAIL account must already have access to this region-locked app." >&2
            elif grep -Fq "Permission denied" .work/apkeep.log; then
              echo "apkeep could not write the downloaded files to the mounted output directory." >&2
            elif grep -Fq "Skipping" .work/apkeep.log; then
              echo "apkeep skipped the Google Play download; inspect the output above." >&2
            else
              echo "apkeep exited successfully but produced no APK files." >&2
            fi
            exit 1
          fi

      - name: Merge Google Play split APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/google-play-apks .work/android-input

          mapfile -d '' APK_FILES < <(find .work/google-play -type f -name '*.apk' -print0)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "apkeep did not download any APK files" >&2
            exit 1
          fi

          mapfile -d '' OBB_FILES < <(find .work/google-play -type f -name '*.obb' -print0)
          if [ "${#OBB_FILES[@]}" -ne 0 ]; then
            echo "Google Play returned OBB expansion files; this build flow does not yet package them:" >&2
            printf '  %s\n' "${OBB_FILES[@]}" >&2
            exit 1
          fi

          for source in "${APK_FILES[@]}"; do
            name="$(basename "$source")"
            destination=".work/google-play-apks/$name"
            if [ -e "$destination" ]; then
              echo "duplicate downloaded APK filename: $name" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done

          if [ "${#APK_FILES[@]}" -eq 1 ]; then
            cp "${APK_FILES[0]}" .work/android-input/base-google-play.apk
          else
            # Preserve the merged Play APK signing metadata. The builder later
            # transplants this signing block into the modified LSPatch input.
            java -jar .work/android-tools/APKEditor.jar m \
              -i .work/google-play-apks \
              -o .work/android-input/base-google-play.apk \
              -f \
              -validate-modules
          fi

          test -s .work/android-input/base-google-play.apk
          sha256sum .work/android-input/base-google-play.apk

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .secrets output/android
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .secrets/android-signing.keystore
          chmod 600 .secrets/android-signing.keystore

      - name: Build Korean APK input for LSPatch
        shell: bash
        env:
          RELEASE_INDEX_URL: https://raw.githubusercontent.com/${{ github.repository }}/distribution/release-index.json
        run: |
          set -euo pipefail
          python tools/android/build_game_apk.py \
            --base-apk .work/android-input/base-google-play.apk \
            --output .work/android-input/korean-pre-lspatch.apk \
            --release-index-url "$RELEASE_INDEX_URL" \
            --prepare-for-lspatch

      - name: Apply LSPatch and sign final Korean APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .work/lspatch-final output/android
          java -jar .work/android-tools/lspatch.jar \
            --verbose \
            --force \
            --sigbypasslv 2 \
            --keystore \
              .secrets/android-signing.keystore \
              "$KEYSTORE_PASSWORD" \
              "$KEY_ALIAS" \
              "$KEY_PASSWORD" \
            --output .work/lspatch-final \
            .work/android-input/korean-pre-lspatch.apk

          mapfile -d '' PATCHED_APKS < <(find .work/lspatch-final -maxdepth 1 -type f -name '*.apk' -print0)
          if [ "${#PATCHED_APKS[@]}" -ne 1 ]; then
            echo "expected exactly one LSPatch output APK, found ${#PATCHED_APKS[@]}" >&2
            find .work/lspatch-final -maxdepth 1 -type f -printf '%f\n' >&2 || true
            exit 1
          fi
          cp "${PATCHED_APKS[0]}" output/android/AstralPartyKorean.apk
          python3 - <<'PYMETA'
          import json
          from pathlib import Path

          source = Path('.work/android-input/korean-pre-lspatch.apk.json')
          target = Path('output/android/AstralPartyKorean.apk.json')
          metadata = json.loads(source.read_text(encoding='utf-8'))
          metadata['output'] = str(target.with_suffix(''))
          target.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PYMETA

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            output/android/AstralPartyKorean.apk

      - name: Read APK metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=output/android/AstralPartyKorean.apk
          META="$APK.json"
          GAME_VERSION="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseVersionName"])' "$META")"
          if [ -z "$GAME_VERSION" ] || [ "${GAME_VERSION,,}" = "unknown" ]; then
            echo "refusing to publish Android APK with invalid game version: $GAME_VERSION" >&2
            exit 1
          fi
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK")"
          TAG="int-apk-v${GAME_VERSION}"
          echo "game_version=$GAME_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "APK game version: $GAME_VERSION"
          echo "APK SHA-256: $SHA256"
          echo "APK size: $SIZE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: astral-party-int-apk
          path: output/android/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          python tools/workflow/release_notes.py android \
            --output .work/android-release-notes.md \
            --game-version '${{ steps.apk.outputs.game_version }}' \
            --sha256 '${{ steps.apk.outputs.sha256 }}' \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Publish Android APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          GAME_VERSION: ${{ steps.apk.outputs.game_version }}
        run: |
          set -euo pipefail
          # Replace only after the new APK has passed the complete build/signature
          # verification pipeline.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
          fi
          gh release create "$TAG" \
            output/android/AstralPartyKorean.apk \
            --target "$GITHUB_SHA" \
            --title "INT_APK v$GAME_VERSION" \
            --notes-file .work/android-release-notes.md

      - name: Update Android APK distribution index
        shell: bash
        env:
          TAG: ${{ steps.apk.outputs.tag }}
          GAME_VERSION: ${{ steps.apk.outputs.game_version }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          SIZE: ${{ steps.apk.outputs.size }}
        run: |
          set -euo pipefail
          INDEX="$RUNNER_TEMP/android-apk-index.json"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/AstralPartyKorean.apk"
          python3 - "$INDEX" "$GAME_VERSION" "$DOWNLOAD_URL" "$SHA256" "$SIZE" <<'PYINDEX'
          import json
          import sys

          path, version, url, sha256, size = sys.argv[1:]
          payload = {
              "schemaVersion": 1,
              "packageName": "com.feimo.astralpartyjpn",
              "gameVersion": version,
              "downloadUrl": url,
              "sha256": sha256,
              "size": int(size),
              "installerPackageName": "com.android.vending",
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PYINDEX
          python tools/distribution/publish_file.py \
            --source "$INDEX" \
            --path android-apk-index.json \
            --message "chore: update Android APK distribution index"
          if gh release view android-apk-index >/dev/null 2>&1; then
            gh release upload android-apk-index "$INDEX" --clobber ||               echo 'warning: failed to mirror legacy android-apk-index release' >&2
          fi
