name: Build Android Korean Game APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_PACKAGE: com.feimo.astralpartyjpn
      APKEEP_IMAGE: ghcr.io/efforg/apkeep:stable
      PLAY_OPTIONS: locale=jp,timezone=UTC+9,split_apk=1,include_additional_files=true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          python -m pip install -e './builder[dev]'

          mkdir -p .work/android-tools
          curl --fail --location --retry 3 \
            --output .work/android-tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          cat > .work/android-tools/apktool <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec java -jar "$(dirname "$0")/apktool.jar" "$@"
          EOF
          chmod +x .work/android-tools/apktool
          echo "$PWD/.work/android-tools" >> "$GITHUB_PATH"

          curl --fail --location --retry 3 \
            --output .work/android-tools/APKEditor.jar \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar

      - name: Validate secrets
        shell: bash
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          AAS_TOKEN: ${{ secrets.AAS_TOKEN }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PLAY_EMAIL"
          test -n "$AAS_TOKEN"
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Download current game from Google Play
        shell: bash
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          AAS_TOKEN: ${{ secrets.AAS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .work/google-play
          docker pull "$APKEEP_IMAGE"
          docker run --rm \
            -v "$PWD/.work/google-play:/output" \
            "$APKEEP_IMAGE" \
            -a "$ANDROID_PACKAGE" \
            -d google-play \
            -o "$PLAY_OPTIONS" \
            -e "$PLAY_EMAIL" \
            -t "$AAS_TOKEN" \
            /output

          echo "Downloaded Google Play files:"
          find .work/google-play -type f -printf '%P\n' | sort

      - name: Merge Google Play split APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/google-play-apks .work/android-input

          mapfile -d '' APK_FILES < <(find .work/google-play -type f -name '*.apk' -print0)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "apkeep did not download any APK files" >&2
            exit 1
          fi

          mapfile -d '' OBB_FILES < <(find .work/google-play -type f -name '*.obb' -print0)
          if [ "${#OBB_FILES[@]}" -ne 0 ]; then
            echo "Google Play returned OBB expansion files; this build flow does not yet package them:" >&2
            printf '  %s\n' "${OBB_FILES[@]}" >&2
            exit 1
          fi

          for source in "${APK_FILES[@]}"; do
            name="$(basename "$source")"
            destination=".work/google-play-apks/$name"
            if [ -e "$destination" ]; then
              echo "duplicate downloaded APK filename: $name" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done

          if [ "${#APK_FILES[@]}" -eq 1 ]; then
            cp "${APK_FILES[0]}" .work/android-input/base-google-play.apk
          else
            java -jar .work/android-tools/APKEditor.jar m \
              -i .work/google-play-apks \
              -o .work/android-input/base-google-play.apk \
              -f \
              -clean-meta \
              -validate-modules
          fi

          test -s .work/android-input/base-google-play.apk
          sha256sum .work/android-input/base-google-play.apk

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .secrets output/android
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .secrets/android-signing.keystore
          chmod 600 .secrets/android-signing.keystore

      - name: Build self-patching Korean APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASTRAL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ASTRAL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/patch-index/release-index.json
        run: |
          set -euo pipefail
          python tools/android/build_game_apk.py \
            --base-apk .work/android-input/base-google-play.apk \
            --output output/android/AstralParty_INT_Korean.apk \
            --release-index-url "$RELEASE_INDEX_URL" \
            --keystore .secrets/android-signing.keystore \
            --key-alias "$KEY_ALIAS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: astral-party-int-android-korean-apk
          path: output/android/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
