name: Test Android Signature Bypass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANDROID_PACKAGE: com.feimo.astralpartyjpn
      APKEEP_IMAGE: ghcr.io/efforg/apkeep:stable
      PLAY_OPTIONS: locale=ja_JP,timezone=Asia/Tokyo,split_apk=1,include_additional_files=true
      LSPATCH_URL: https://github.com/LSPosed/LSPatch/releases/download/v0.6/jar-v0.6-398-release.jar
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install diagnostic tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

          mkdir -p .work/android-tools
          curl --fail --location --retry 3 \
            --output .work/android-tools/APKEditor.jar \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
          curl --fail --location --retry 3 \
            --output .work/android-tools/lspatch.jar \
            "$LSPATCH_URL"

          java -jar .work/android-tools/lspatch.jar --help || true

      - name: Validate Google Play secrets
        shell: bash
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          AAS_TOKEN: ${{ secrets.AAS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PLAY_EMAIL"
          test -n "$AAS_TOKEN"

      - name: Download current game from Google Play
        shell: bash
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          AAS_TOKEN: ${{ secrets.AAS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .work/google-play
          docker pull "$APKEEP_IMAGE"
          set +e
          docker run --rm \
            -v "$PWD/.work/google-play:/output" \
            "$APKEEP_IMAGE" \
            -a "$ANDROID_PACKAGE" \
            -d google-play \
            -o "$PLAY_OPTIONS" \
            -e "$PLAY_EMAIL" \
            -t "$AAS_TOKEN" \
            /output 2>&1 | tee .work/apkeep.log
          APKEEP_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$APKEEP_STATUS" -ne 0 ]; then
            echo "apkeep exited with status $APKEEP_STATUS" >&2
            exit "$APKEEP_STATUS"
          fi

          echo "Downloaded Google Play files:"
          find .work/google-play -type f -printf '%P\n' | sort

          mapfile -d '' DOWNLOADED_APKS < <(find .work/google-play -type f -name '*.apk' -print0)
          if [ "${#DOWNLOADED_APKS[@]}" -eq 0 ]; then
            echo "apkeep produced no APK files; inspect the output above." >&2
            exit 1
          fi

          mapfile -d '' OBB_FILES < <(find .work/google-play -type f -name '*.obb' -print0)
          if [ "${#OBB_FILES[@]}" -ne 0 ]; then
            echo "Google Play returned OBB expansion files; this diagnostic does not package them:" >&2
            printf '  %s\n' "${OBB_FILES[@]}" >&2
            exit 1
          fi

      - name: Merge split APKs while preserving original signature metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/google-play-apks .work/android-input

          mapfile -d '' APK_FILES < <(find .work/google-play -type f -name '*.apk' -print0)
          for source in "${APK_FILES[@]}"; do
            name="$(basename "$source")"
            destination=".work/google-play-apks/$name"
            if [ -e "$destination" ]; then
              echo "duplicate downloaded APK filename: $name" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done

          if [ "${#APK_FILES[@]}" -eq 1 ]; then
            cp "${APK_FILES[0]}" .work/android-input/base-google-play.apk
          else
            # Intentionally do not use -clean-meta here. LSPatch level 2 needs the
            # original Play signing certificate from the input APK for spoofing.
            java -jar .work/android-tools/APKEditor.jar m \
              -i .work/google-play-apks \
              -o .work/android-input/base-google-play.apk \
              -f \
              -validate-modules
          fi

          test -s .work/android-input/base-google-play.apk
          sha256sum .work/android-input/base-google-play.apk
          echo "Preserved signature metadata reported by APKEditor:"
          java -jar .work/android-tools/APKEditor.jar info \
            -i .work/android-input/base-google-play.apk \
            -signatures || true

      - name: Apply LSPatch signature bypass only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/lspatch output/android

          java -jar .work/android-tools/lspatch.jar \
            -v \
            -f \
            -l 2 \
            -o .work/lspatch \
            .work/android-input/base-google-play.apk

          mapfile -d '' PATCHED_APKS < <(find .work/lspatch -maxdepth 1 -type f -name '*-lspatched.apk' -print0)
          if [ "${#PATCHED_APKS[@]}" -ne 1 ]; then
            echo "expected exactly one LSPatch output APK, found ${#PATCHED_APKS[@]}" >&2
            find .work/lspatch -maxdepth 1 -type f -printf '%f\n' >&2 || true
            exit 1
          fi

          cp "${PATCHED_APKS[0]}" output/android/AstralParty_INT_LSPatch_Test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            output/android/AstralParty_INT_LSPatch_Test.apk
          sha256sum output/android/AstralParty_INT_LSPatch_Test.apk

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v7
        with:
          name: astral-party-int-lspatch-test
          path: output/android/AstralParty_INT_LSPatch_Test.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
