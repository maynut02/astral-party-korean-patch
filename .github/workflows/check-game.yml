name: Check Game

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      game_version: ${{ steps.check.outputs.game_version }}
      revision: ${{ steps.check.outputs.revision }}
      catalog_hash: ${{ steps.check.outputs.catalog_hash }}
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      GAME_VERSION: ${{ vars.GAME_VERSION || '3.2.0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - name: Install builder
        run: python -m pip install -e './builder[dev]'
      - name: Apply database migrations
        run: python database/migrate.py
      - name: Check remote revision
        id: check
        run: >-
          astral-builder check
          --route INT_STEAM
          --game-version "$GAME_VERSION"
          --github-output "$GITHUB_OUTPUT"

  sync:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/sync-game.yml
    with:
      game_version: ${{ needs.check.outputs.game_version }}
    secrets: inherit
