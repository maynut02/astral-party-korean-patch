name: Fetch Legacy Game Data

on:
  workflow_dispatch:
    inputs:
      route:
        description: Steam route whose data.unity3d should be fetched
        required: true
        default: INT_STEAM
        type: choice
        options:
          - INT_STEAM
          - CN_STEAM
  workflow_call:
    inputs:
      route:
        required: true
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.fetch.outputs.artifact_name }}
      run_id:
        value: ${{ jobs.fetch.outputs.run_id }}

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      run_id: ${{ github.run_id }}
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      DEPOTDOWNLOADER_LOGIN_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Validate Steam credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STEAM_USERNAME"
          test -n "$DEPOTDOWNLOADER_LOGIN_TOKEN"
      - name: Resolve route game data path
        id: route
        shell: bash
        env:
          ROUTE: ${{ inputs.route }}
        run: |
          set -euo pipefail
          case "$ROUTE" in
            INT_STEAM)
              relative='8vJXnINT/AstralParty_INT_Data/data.unity3d'
              slug='int-steam'
              ;;
            CN_STEAM)
              relative='8vJXn6CN/AstralParty_CN_Data/data.unity3d'
              slug='cn-steam'
              ;;
            *)
              echo "Unsupported Steam legacy route: $ROUTE" >&2
              exit 1
              ;;
          esac
          echo "relative_path=$relative" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned DepotDownloader source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/SteamRE/DepotDownloader.git .work/DepotDownloader
          git -C .work/DepotDownloader checkout --detach c553ef4d60c00a4f5fd16c9fe017f569001589ff
          git -C .work/DepotDownloader apply "$GITHUB_WORKSPACE/tools/depotdownloader-ci.patch"
          test "$(git -C .work/DepotDownloader rev-parse HEAD)" = c553ef4d60c00a4f5fd16c9fe017f569001589ff
      - name: Build DepotDownloader
        run: >-
          dotnet build
          .work/DepotDownloader/DepotDownloader/DepotDownloader.csproj
          -c Release
          --nologo
      - name: Download only route data.unity3d
        shell: bash
        env:
          RELATIVE_PATH: ${{ steps.route.outputs.relative_path }}
        run: |
          set -euo pipefail
          mkdir -p .work/steam-download
          printf '%s\n' "$RELATIVE_PATH" > .work/legacy-filelist.txt
          dotnet run \
            --project .work/DepotDownloader/DepotDownloader/DepotDownloader.csproj \
            -c Release \
            --no-build \
            -- \
            -app 2622000 \
            -depot 2622001 \
            -username "$STEAM_USERNAME" \
            -remember-password \
            -os windows \
            -filelist .work/legacy-filelist.txt \
            -dir .work/steam-download
      - name: Verify legacy input
        id: verify
        shell: bash
        env:
          RELATIVE_PATH: ${{ steps.route.outputs.relative_path }}
        run: |
          set -euo pipefail
          path=".work/steam-download/$RELATIVE_PATH"
          test -s "$path"
          size="$(stat -c '%s' "$path")"
          sha="$(sha256sum "$path" | cut -d' ' -f1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          printf 'data.unity3d route=%s size=%s sha256=%s\n' '${{ inputs.route }}' "$size" "$sha"
      - name: Stage minimal artifact
        shell: bash
        env:
          SOURCE_PATH: ${{ steps.verify.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p .work/legacy-artifact
          cp "$SOURCE_PATH" .work/legacy-artifact/data.unity3d
      - name: Define artifact metadata
        id: meta
        run: echo 'artifact_name=astral-party-legacy-data-${{ steps.route.outputs.slug }}' >> "$GITHUB_OUTPUT"
      - name: Upload legacy input artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: .work/legacy-artifact/data.unity3d
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
