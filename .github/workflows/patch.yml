name: Patch

on:
  workflow_dispatch:
  repository_dispatch:
    types: [patch-watcher]

concurrency:
  group: patch-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_INDEX_URL: https://raw.githubusercontent.com/${{ github.repository }}/distribution/release-index.json

jobs:
  source:
    name: Resolve patch source
    runs-on: ubuntu-latest
    outputs:
      automatic: ${{ steps.resolve.outputs.automatic }}
      game_version: ${{ steps.resolve.outputs.game_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve automatic or manual source
        id: resolve
        shell: bash
        env:
          WATCHER_GAME_VERSION: ${{ github.event.client_payload.game_version || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
            test -n "$WATCHER_GAME_VERSION"
            echo 'automatic=true' >> "$GITHUB_OUTPUT"
            echo "game_version=$WATCHER_GAME_VERSION" >> "$GITHUB_OUTPUT"
            echo 'release_tag=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="$(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
              --json tagName,publishedAt,isDraft,isPrerelease \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | test("^v.+_r[0-9]+(_p[0-9]+)?$")))] | sort_by(.publishedAt) | last | .tagName // empty'
          )"
          if [ -z "$tag" ]; then
            echo 'manual patch requires an existing patch release' >&2
            exit 1
          fi
          echo 'automatic=false' >> "$GITHUB_OUTPUT"
          echo 'game_version=' >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  check:
    name: Check ${{ matrix.route }}
    needs: source
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.ASTRAL_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.ASTRAL_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: INT_STEAM
            slug: int_steam
          - route: CN_STEAM
            slug: cn_steam
          - route: INT_ANDROID
            slug: int_android
          - route: CN_ANDROID
            slug: cn_android
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-database-tunnel
        with:
          host: ${{ secrets.DB_SSH_HOST }}
          user: ${{ secrets.DB_SSH_USER }}
          private-key: ${{ secrets.DB_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DB_SSH_KNOWN_HOSTS }}
      - uses: ./.github/actions/setup-builder
      - name: Check remote revision and catalog
        if: needs.source.outputs.automatic == 'true'
        run: |
          mkdir -p .work/check
          astral-builder check \
            --route '${{ matrix.route }}' \
            --game-version '${{ needs.source.outputs.game_version }}' \
            --github-output '.work/check/${{ matrix.slug }}.env'
      - name: Download latest released manifest
        if: needs.source.outputs.automatic != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/reuse
          gh release download '${{ needs.source.outputs.release_tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '${{ matrix.route }}_manifest.json' \
            --dir .work/reuse
      - name: Reuse latest released revision
        if: needs.source.outputs.automatic != 'true'
        run: |
          mkdir -p .work/check
          astral-builder reuse-release \
            --manifest '.work/reuse/${{ matrix.route }}_manifest.json' \
            --route '${{ matrix.route }}' \
            --github-output '.work/check/${{ matrix.slug }}.env'
      - name: Upload route check
        uses: actions/upload-artifact@v7
        with:
          name: patch-check-${{ matrix.slug }}
          path: .work/check/${{ matrix.slug }}.env
          if-no-files-found: error
          retention-days: 1

  plan:
    name: Plan patch run
    needs: [source, check]
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.aggregate.outputs.should_run }}
      automatic: ${{ needs.source.outputs.automatic }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      patch_version: ${{ steps.release.outputs.patch_version }}
      original_tag: ${{ steps.release.outputs.original_tag }}
      original_mode: ${{ steps.release.outputs.original_mode }}
      publish_original: ${{ steps.release.outputs.publish_original }}
      game_version: ${{ steps.aggregate.outputs.game_version }}
      max_revision: ${{ steps.aggregate.outputs.max_revision }}
      updated_routes_csv: ${{ steps.aggregate.outputs.updated_routes_csv }}
    steps:
      - uses: actions/checkout@v6
      - name: Download route checks
        uses: actions/download-artifact@v7
        with:
          pattern: patch-check-*
          path: .work/check
          merge-multiple: true
      - name: Aggregate route checks
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          python tools/workflow/patch_plan.py \
            --checks-dir .work/check \
            --github-output "$GITHUB_OUTPUT"
      - name: Define immutable release identity
        if: steps.aggregate.outputs.should_run == 'true'
        id: release
        shell: bash
        env:
          VERSION: ${{ steps.aggregate.outputs.game_version }}
          MAX_REVISION: ${{ steps.aggregate.outputs.max_revision }}
          AUTOMATIC: ${{ needs.source.outputs.automatic }}
        run: |
          set -euo pipefail
          base="v${VERSION}_r${MAX_REVISION}"
          mkdir -p .work
          git ls-remote --tags --refs origin "refs/tags/${base}*" \
            | awk '{sub("refs/tags/", "", $2); print $2}' > .work/existing-patch-tags.txt
          tag="$(python tools/workflow/release_tag.py \
            --base "$base" \
            --tags-file .work/existing-patch-tags.txt)"
          title="$tag"
          patch_version="$tag"

          original_tag="${base}-original"
          if [ "$tag" = "${base}_p0" ] && [ "$AUTOMATIC" != true ]; then
            echo 'manual patch cannot create a new p0 release' >&2
            exit 1
          fi
          if [ "$tag" = "${base}_p0" ]; then
            original_mode=unified
            publish_original=true
          elif git ls-remote --exit-code --tags origin "refs/tags/${original_tag}" >/dev/null 2>&1; then
            original_mode=unified
            publish_original=false
          else
            # Existing revisions created before unified originals keep using their immutable route releases.
            original_mode=legacy
            publish_original=false
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "patch_version=$patch_version" >> "$GITHUB_OUTPUT"
          echo "original_tag=$original_tag" >> "$GITHUB_OUTPUT"
          echo "original_mode=$original_mode" >> "$GITHUB_OUTPUT"
          echo "publish_original=$publish_original" >> "$GITHUB_OUTPUT"
      - name: No route update detected
        if: steps.aggregate.outputs.should_run != 'true'
        run: echo 'All routes already have a published build for their current revisions.'

  sync:
    name: Sync ${{ matrix.route }}
    needs: [check, plan]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.ASTRAL_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.ASTRAL_DATABASE_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: INT_STEAM
            slug: int_steam
            config: routes/int_steam.yaml
          - route: CN_STEAM
            slug: cn_steam
            config: routes/cn_steam.yaml
          - route: INT_ANDROID
            slug: int_android
            config: routes/int_android.yaml
          - route: CN_ANDROID
            slug: cn_android
            config: routes/cn_android.yaml
    steps:
      - uses: actions/checkout@v6
      - name: Download route check
        uses: actions/download-artifact@v7
        with:
          name: patch-check-${{ matrix.slug }}
          path: .work/check
      - name: Determine whether full sync is required
        id: current
        shell: bash
        run: |
          set -euo pipefail
          file='.work/check/${{ matrix.slug }}.env'
          sync_required="$(sed -n 's/^sync_required=//p' "$file" | tail -1)"
          test "$sync_required" = true -o "$sync_required" = false
          echo "sync_required=$sync_required" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-database-tunnel
        if: steps.current.outputs.sync_required == 'true'
        with:
          host: ${{ secrets.DB_SSH_HOST }}
          user: ${{ secrets.DB_SSH_USER }}
          private-key: ${{ secrets.DB_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DB_SSH_KNOWN_HOSTS }}
      - uses: ./.github/actions/setup-builder
        if: steps.current.outputs.sync_required == 'true'
      - name: Synchronize route resources
        if: steps.current.outputs.sync_required == 'true'
        run: |
          mkdir -p .work/state
          astral-builder sync \
            --game-version '${{ needs.plan.outputs.game_version }}' \
            --route-config '${{ matrix.config }}' \
            --work-dir '.work/sync-${{ matrix.slug }}' \
            --github-output '.work/state/${{ matrix.slug }}.env'
      - name: Reuse already synchronized route state
        if: steps.current.outputs.sync_required != 'true'
        shell: bash
        run: |
          mkdir -p .work/state
          cp '.work/check/${{ matrix.slug }}.env' '.work/state/${{ matrix.slug }}.env'
          {
            echo 'source_added=0'
            echo 'source_modified=0'
            echo 'source_removed=0'
          } >> '.work/state/${{ matrix.slug }}.env'
      - name: Upload synchronized route state
        uses: actions/upload-artifact@v7
        with:
          name: patch-state-${{ matrix.slug }}
          path: .work/state/${{ matrix.slug }}.env
          if-no-files-found: error
          retention-days: 1

  state:
    name: Collect route state
    needs: [plan, sync]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.ASTRAL_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.ASTRAL_DATABASE_URL }}
    outputs:
      int_steam_revision_id: ${{ steps.collect.outputs.int_steam_revision_id }}
      cn_steam_revision_id: ${{ steps.collect.outputs.cn_steam_revision_id }}
      int_android_revision_id: ${{ steps.collect.outputs.int_android_revision_id }}
      cn_android_revision_id: ${{ steps.collect.outputs.cn_android_revision_id }}
      int_steam_revision: ${{ steps.collect.outputs.int_steam_revision }}
      cn_steam_revision: ${{ steps.collect.outputs.cn_steam_revision }}
      int_android_revision: ${{ steps.collect.outputs.int_android_revision }}
      cn_android_revision: ${{ steps.collect.outputs.cn_android_revision }}
      source_added: ${{ steps.collect.outputs.source_added }}
      source_modified: ${{ steps.collect.outputs.source_modified }}
      source_removed: ${{ steps.collect.outputs.source_removed }}
      translation_total: ${{ steps.translations.outputs.total }}
      translation_approved: ${{ steps.translations.outputs.approved }}
      translation_untranslated: ${{ steps.translations.outputs.untranslated }}
      translation_pending: ${{ steps.translations.outputs.pending }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-database-tunnel
        with:
          host: ${{ secrets.DB_SSH_HOST }}
          user: ${{ secrets.DB_SSH_USER }}
          private-key: ${{ secrets.DB_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DB_SSH_KNOWN_HOSTS }}
      - uses: ./.github/actions/setup-builder
      - name: Download route states
        uses: actions/download-artifact@v7
        with:
          pattern: patch-state-*
          path: .work/state
          merge-multiple: true
      - name: Collect route revision IDs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          read_output() {
            local file="$1"
            local key="$2"
            sed -n "s/^${key}=//p" "$file" | tail -1
          }
          for slug in int_steam cn_steam int_android cn_android; do
            file=".work/state/${slug}.env"
            revision_id="$(read_output "$file" revision_id)"
            revision="$(read_output "$file" revision)"
            test -n "$revision_id"
            test -n "$revision"
            echo "${slug}_revision_id=$revision_id" >> "$GITHUB_OUTPUT"
            echo "${slug}_revision=$revision" >> "$GITHUB_OUTPUT"
          done
          for key in source_added source_modified source_removed; do
            value="$(read_output .work/state/int_steam.env "$key")"
            echo "$key=${value:-0}" >> "$GITHUB_OUTPUT"
          done
      - name: Report production translation state
        id: translations
        run: >-
          astral-builder translation-status
          --revision-id '${{ steps.collect.outputs.int_steam_revision_id }}'
          --github-output "$GITHUB_OUTPUT"
      - name: Write state summary
        shell: bash
        run: |
          {
            echo '## Patch state'
            echo
            echo "- Release: \`${{ needs.plan.outputs.title }}\`"
            echo "- Highest route revision: \`r${{ needs.plan.outputs.max_revision }}\`"
            echo "- INT_STEAM source changes: \`+${{ steps.collect.outputs.source_added }} / ~${{ steps.collect.outputs.source_modified }} / -${{ steps.collect.outputs.source_removed }}\`"
            echo "- Production translations: \`${{ steps.translations.outputs.approved }} / ${{ steps.translations.outputs.total }}\`"
            echo "- Pending proposals: \`${{ steps.translations.outputs.pending }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  steam-inputs:
    name: Fetch Steam legacy inputs
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      DEPOTDOWNLOADER_LOGIN_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Download both data.unity3d files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STEAM_USERNAME"
          test -n "$DEPOTDOWNLOADER_LOGIN_TOKEN"
          git clone --filter=blob:none https://github.com/SteamRE/DepotDownloader.git .work/DepotDownloader
          git -C .work/DepotDownloader checkout --detach c553ef4d60c00a4f5fd16c9fe017f569001589ff
          git -C .work/DepotDownloader apply "$GITHUB_WORKSPACE/tools/depotdownloader-ci.patch"
          test "$(git -C .work/DepotDownloader rev-parse HEAD)" = c553ef4d60c00a4f5fd16c9fe017f569001589ff
          dotnet build .work/DepotDownloader/DepotDownloader/DepotDownloader.csproj -c Release --nologo
          mkdir -p .work/steam-download
          cat > .work/legacy-filelist.txt <<'EOF'
          8vJXnINT/AstralParty_INT_Data/data.unity3d
          8vJXn6CN/AstralParty_CN_Data/data.unity3d
          EOF
          dotnet run \
            --project .work/DepotDownloader/DepotDownloader/DepotDownloader.csproj \
            -c Release \
            --no-build \
            -- \
            -app 2622000 \
            -depot 2622001 \
            -username "$STEAM_USERNAME" \
            -remember-password \
            -os windows \
            -filelist .work/legacy-filelist.txt \
            -dir .work/steam-download
          test -s .work/steam-download/8vJXnINT/AstralParty_INT_Data/data.unity3d
          test -s .work/steam-download/8vJXn6CN/AstralParty_CN_Data/data.unity3d
      - name: Upload INT_STEAM legacy input
        uses: actions/upload-artifact@v7
        with:
          name: patch-steam-int_steam
          path: .work/steam-download/8vJXnINT/AstralParty_INT_Data/data.unity3d
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload CN_STEAM legacy input
        uses: actions/upload-artifact@v7
        with:
          name: patch-steam-cn_steam
          path: .work/steam-download/8vJXn6CN/AstralParty_CN_Data/data.unity3d
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-steam:
    name: Build ${{ matrix.route }}
    needs: [plan, state, steam-inputs]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.ASTRAL_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.ASTRAL_DATABASE_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: INT_STEAM
            slug: int_steam
            config: routes/int_steam.yaml
            legacy_artifact: patch-steam-int_steam
            legacy_dir: .work/steam-download/8vJXnINT/AstralParty_INT_Data
            legacy_path: .work/steam-download/8vJXnINT/AstralParty_INT_Data/data.unity3d
          - route: CN_STEAM
            slug: cn_steam
            config: routes/cn_steam.yaml
            legacy_artifact: patch-steam-cn_steam
            legacy_dir: .work/steam-download/8vJXn6CN/AstralParty_CN_Data
            legacy_path: .work/steam-download/8vJXn6CN/AstralParty_CN_Data/data.unity3d
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-database-tunnel
        with:
          host: ${{ secrets.DB_SSH_HOST }}
          user: ${{ secrets.DB_SSH_USER }}
          private-key: ${{ secrets.DB_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DB_SSH_KNOWN_HOSTS }}
      - uses: ./.github/actions/setup-builder
      - name: Download route Steam input
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.legacy_artifact }}
          path: ${{ matrix.legacy_dir }}
      - name: Build and validate
        id: build
        shell: bash
        env:
          INT_STEAM_REVISION_ID: ${{ needs.state.outputs.int_steam_revision_id }}
          CN_STEAM_REVISION_ID: ${{ needs.state.outputs.cn_steam_revision_id }}
          INT_STEAM_REVISION: ${{ needs.state.outputs.int_steam_revision }}
          CN_STEAM_REVISION: ${{ needs.state.outputs.cn_steam_revision }}
        run: |
          set -euo pipefail
          case '${{ matrix.route }}' in
            INT_STEAM) REVISION_ID="$INT_STEAM_REVISION_ID"; REVISION="$INT_STEAM_REVISION" ;;
            CN_STEAM) REVISION_ID="$CN_STEAM_REVISION_ID"; REVISION="$CN_STEAM_REVISION" ;;
            *) echo 'unsupported Steam route' >&2; exit 1 ;;
          esac
          root='output/patch/${{ matrix.slug }}'
          work='.work/build-${{ matrix.slug }}'
          output_file='.work/build-output.env'
          asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.plan.outputs.tag }}"
          if [ '${{ needs.plan.outputs.original_mode }}' = legacy ]; then
            source_tag="original-${{ matrix.route }}-${{ needs.plan.outputs.game_version }}_r${REVISION#r}"
          else
            source_tag='${{ needs.plan.outputs.original_tag }}'
          fi
          source_asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${source_tag}"
          astral-builder build \
            --revision-id "$REVISION_ID" \
            --route-config '${{ matrix.config }}' \
            --work-dir "$work" \
            --output-dir "$root" \
            --asset-base-url "$asset_base" \
            --source-asset-base-url "$source_asset_base" \
            --patch-version '${{ needs.plan.outputs.patch_version }}' \
            --github-run-id "$GITHUB_RUN_ID" \
            --git-commit "$GITHUB_SHA" \
            --legacy-data '${{ matrix.legacy_path }}' \
            --github-output "$output_file"
          astral-builder validate-build \
            --manifest "$root/manifest.json" \
            --assets-dir "$root/assets" \
            --route-config '${{ matrix.config }}'
          mkdir -p output/release
          cp "$root/manifest.json" 'output/release/${{ matrix.route }}_manifest.json'
          cp "$root"/assets/* output/release/
          mkdir -p 'output/originals/${{ matrix.route }}'
          cp "$root"/originals/* 'output/originals/${{ matrix.route }}/'
          python tools/workflow/manual_patch.py \
            --manifest "$root/manifest.json" \
            --payloads-dir "$work/payloads" \
            --output 'output/release/${{ matrix.route }}_manual_patch.zip'
          build_id="$(sed -n 's/^build_id=//p' "$output_file" | tail -1)"
          test -n "$build_id"
          printf '%s\n' "$build_id" > 'output/release/${{ matrix.route }}_build_id.txt'
      - name: Upload route build
        uses: actions/upload-artifact@v7
        with:
          name: patch-build-${{ matrix.slug }}
          path: output/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload route originals
        uses: actions/upload-artifact@v7
        with:
          name: patch-originals-${{ matrix.slug }}
          path: output/originals/${{ matrix.route }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-android:
    name: Build ${{ matrix.route }}
    needs: [plan, state]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.ASTRAL_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.ASTRAL_DATABASE_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: INT_ANDROID
            slug: int_android
            config: routes/int_android.yaml
          - route: CN_ANDROID
            slug: cn_android
            config: routes/cn_android.yaml
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-database-tunnel
        with:
          host: ${{ secrets.DB_SSH_HOST }}
          user: ${{ secrets.DB_SSH_USER }}
          private-key: ${{ secrets.DB_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DB_SSH_KNOWN_HOSTS }}
      - uses: ./.github/actions/setup-builder
      - name: Build and validate
        shell: bash
        env:
          INT_ANDROID_REVISION_ID: ${{ needs.state.outputs.int_android_revision_id }}
          CN_ANDROID_REVISION_ID: ${{ needs.state.outputs.cn_android_revision_id }}
          INT_ANDROID_REVISION: ${{ needs.state.outputs.int_android_revision }}
          CN_ANDROID_REVISION: ${{ needs.state.outputs.cn_android_revision }}
        run: |
          set -euo pipefail
          case '${{ matrix.route }}' in
            INT_ANDROID) REVISION_ID="$INT_ANDROID_REVISION_ID"; REVISION="$INT_ANDROID_REVISION" ;;
            CN_ANDROID) REVISION_ID="$CN_ANDROID_REVISION_ID"; REVISION="$CN_ANDROID_REVISION" ;;
            *) echo 'unsupported Android route' >&2; exit 1 ;;
          esac
          root='output/patch/${{ matrix.slug }}'
          work='.work/build-${{ matrix.slug }}'
          output_file='.work/build-output-${{ matrix.slug }}.env'
          asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.plan.outputs.tag }}"
          if [ '${{ needs.plan.outputs.original_mode }}' = legacy ]; then
            source_tag="original-${{ matrix.route }}-${{ needs.plan.outputs.game_version }}_r${REVISION#r}"
          else
            source_tag='${{ needs.plan.outputs.original_tag }}'
          fi
          source_asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${source_tag}"
          astral-builder build \
            --revision-id "$REVISION_ID" \
            --route-config '${{ matrix.config }}' \
            --work-dir "$work" \
            --output-dir "$root" \
            --asset-base-url "$asset_base" \
            --source-asset-base-url "$source_asset_base" \
            --patch-version '${{ needs.plan.outputs.patch_version }}' \
            --github-run-id "$GITHUB_RUN_ID" \
            --git-commit "$GITHUB_SHA" \
            --github-output "$output_file"
          astral-builder validate-build \
            --manifest "$root/manifest.json" \
            --assets-dir "$root/assets" \
            --route-config '${{ matrix.config }}'
          mkdir -p output/release
          cp "$root/manifest.json" 'output/release/${{ matrix.route }}_manifest.json'
          cp "$root"/assets/* output/release/
          mkdir -p 'output/originals/${{ matrix.route }}'
          cp "$root"/originals/* 'output/originals/${{ matrix.route }}/'
          python tools/workflow/manual_patch.py \
            --manifest "$root/manifest.json" \
            --payloads-dir "$work/payloads" \
            --output 'output/release/${{ matrix.route }}_manual_patch.zip'
          build_id="$(sed -n 's/^build_id=//p' "$output_file" | tail -1)"
          test -n "$build_id"
          printf '%s\n' "$build_id" > 'output/release/${{ matrix.route }}_build_id.txt'
      - name: Upload route build
        uses: actions/upload-artifact@v7
        with:
          name: patch-build-${{ matrix.slug }}
          path: output/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload route originals
        uses: actions/upload-artifact@v7
        with:
          name: patch-originals-${{ matrix.slug }}
          path: output/originals/${{ matrix.route }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [plan, state, build-steam, build-android]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Download all route builds
        uses: actions/download-artifact@v7
        with:
          pattern: patch-build-*
          path: output/release
          merge-multiple: true
      - name: Download INT_STEAM originals
        uses: actions/download-artifact@v7
        with:
          name: patch-originals-int_steam
          path: output/originals/INT_STEAM
      - name: Download CN_STEAM originals
        uses: actions/download-artifact@v7
        with:
          name: patch-originals-cn_steam
          path: output/originals/CN_STEAM
      - name: Download INT_ANDROID originals
        uses: actions/download-artifact@v7
        with:
          name: patch-originals-int_android
          path: output/originals/INT_ANDROID
      - name: Download CN_ANDROID originals
        uses: actions/download-artifact@v7
        with:
          name: patch-originals-cn_android
          path: output/originals/CN_ANDROID
      - name: Verify complete release set
        run: |
          set -euo pipefail
          for route in INT_STEAM CN_STEAM INT_ANDROID CN_ANDROID; do
            test -s "output/release/${route}_manifest.json"
            test -s "output/release/${route}_build_id.txt"
            test -d "output/originals/${route}"
          done
      - name: Publish or verify unified original release
        shell: bash
        env:
          ORIGINAL_TAG: ${{ needs.plan.outputs.original_tag }}
          ORIGINAL_MODE: ${{ needs.plan.outputs.original_mode }}
          PUBLISH_ORIGINAL: ${{ needs.plan.outputs.publish_original }}
        run: |
          set -euo pipefail
          mkdir -p .work

          if [ "$ORIGINAL_MODE" = legacy ]; then
            for route in INT_STEAM CN_STEAM INT_ANDROID CN_ANDROID; do
              manifest="output/release/${route}_manifest.json"
              game_version="$(jq -r '.game.version' "$manifest")"
              revision="$(jq -r '.game.revision' "$manifest")"
              revision_number="${revision#r}"
              legacy_tag="original-${route}-${game_version}_r${revision_number}"
              legacy_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${legacy_tag}/"
              jq -e --arg prefix "$legacy_prefix" \
                'all(.files[]; (.sourceDownloadUrl | type == "string") and (.sourceDownloadUrl | startswith($prefix)))' \
                "$manifest" >/dev/null
              if ! gh release view "$legacy_tag" >/dev/null 2>&1; then
                echo "legacy original release not found: $legacy_tag" >&2
                exit 1
              fi
              existing_assets="$(mktemp)"
              gh release view "$legacy_tag" --json assets --jq '.assets[].name' > "$existing_assets"
              while IFS= read -r asset; do
                test -n "$asset"
                if ! grep -Fxq "$asset" "$existing_assets"; then
                  rm -f "$existing_assets"
                  echo "legacy original release is incomplete: $legacy_tag missing $asset" >&2
                  exit 1
                fi
              done < <(jq -r '.files[].sourceDownloadUrl // empty | split("/")[-1]' "$manifest" | sort -u)
              rm -f "$existing_assets"
            done
            echo "reusing legacy per-route original releases"
            exit 0
          fi

          source_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${ORIGINAL_TAG}/"

          expected_assets_file=.work/original-assets.txt
          : > "$expected_assets_file"
          for route in INT_STEAM CN_STEAM INT_ANDROID CN_ANDROID; do
            manifest="output/release/${route}_manifest.json"
            jq -e --arg prefix "$source_prefix" \
              'all(.files[]; (.sourceDownloadUrl | type == "string") and (.sourceDownloadUrl | startswith($prefix)))' \
              "$manifest" >/dev/null
            jq -r '.files[].sourceDownloadUrl // empty | split("/")[-1]' "$manifest" >> "$expected_assets_file"
          done
          sort -u -o "$expected_assets_file" "$expected_assets_file"
          test -s "$expected_assets_file"

          upload_args=()
          while IFS= read -r asset; do
            test -n "$asset"
            matches=(output/originals/*/"$asset")
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]}" ]; then
              echo "original asset missing or ambiguous: $asset" >&2
              exit 1
            fi
            upload_args+=("${matches[0]}")
          done < "$expected_assets_file"

          verify_original_release() {
            local existing_assets
            existing_assets="$(mktemp)"
            gh release view "$ORIGINAL_TAG" --json assets --jq '.assets[].name' > "$existing_assets"
            while IFS= read -r asset; do
              if ! grep -Fxq "$asset" "$existing_assets"; then
                rm -f "$existing_assets"
                echo "immutable original release is incomplete: $ORIGINAL_TAG missing $asset" >&2
                return 1
              fi
            done < "$expected_assets_file"
            rm -f "$existing_assets"
          }

          if [ "$PUBLISH_ORIGINAL" = true ]; then
            if gh release view "$ORIGINAL_TAG" >/dev/null 2>&1; then
              verify_original_release
              echo "reusing unified original release from an earlier pipeline attempt: $ORIGINAL_TAG"
            else
              if git ls-remote --exit-code --tags origin "refs/tags/$ORIGINAL_TAG" >/dev/null 2>&1; then
                echo "immutable original tag exists without a GitHub Release: $ORIGINAL_TAG" >&2
                exit 1
              fi

              python tools/workflow/release_notes.py original-backup \
                --output .work/original-release-notes.md \
                --version '${{ needs.plan.outputs.game_version }}' \
                --int-steam-revision '${{ needs.state.outputs.int_steam_revision }}' \
                --cn-steam-revision '${{ needs.state.outputs.cn_steam_revision }}' \
                --int-android-revision '${{ needs.state.outputs.int_android_revision }}' \
                --cn-android-revision '${{ needs.state.outputs.cn_android_revision }}' \
                --repository "$GITHUB_REPOSITORY" \
                --run-id "$GITHUB_RUN_ID" \
                --run-number "$GITHUB_RUN_NUMBER"

              gh release create "$ORIGINAL_TAG" \
                --draft \
                --target "$GITHUB_SHA" \
                --title "${ORIGINAL_TAG}" \
                --notes-file .work/original-release-notes.md
              cleanup_original() {
                gh release delete "$ORIGINAL_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
              }
              trap cleanup_original ERR
              gh release upload "$ORIGINAL_TAG" "${upload_args[@]}"
              gh release edit "$ORIGINAL_TAG" --draft=false
              trap - ERR
            fi
          else
            if ! gh release view "$ORIGINAL_TAG" >/dev/null 2>&1; then
              echo "reused original release not found: $ORIGINAL_TAG" >&2
              exit 1
            fi
            verify_original_release
            echo "reusing unified original release: $ORIGINAL_TAG"
          fi
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          python tools/workflow/release_notes.py patch \
            --output .work/patch-release-notes.md \
            --updated-routes '${{ needs.plan.outputs.updated_routes_csv }}' \
            --game-version '${{ needs.plan.outputs.game_version }}' \
            --int-steam-revision '${{ needs.state.outputs.int_steam_revision }}' \
            --cn-steam-revision '${{ needs.state.outputs.cn_steam_revision }}' \
            --int-android-revision '${{ needs.state.outputs.int_android_revision }}' \
            --cn-android-revision '${{ needs.state.outputs.cn_android_revision }}' \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"
      - name: Publish release
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "immutable release tag already exists: $TAG" >&2
            exit 1
          fi

          cleanup() {
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          }
          trap cleanup ERR
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file .work/patch-release-notes.md
          find output/release -maxdepth 1 -type f -name '*_build_id.txt' -delete
          gh release upload "$TAG" output/release/*
          gh release edit "$TAG" --draft=false
          trap - ERR

  index:
    name: Update distribution index
    needs: [plan, publish]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
      - name: Download route builds
        uses: actions/download-artifact@v7
        with:
          pattern: patch-build-*
          path: output/release
          merge-multiple: true
      - name: Update shared patch release index
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .work/distribution
          if ! curl --fail --location --silent --show-error \
            "$RELEASE_INDEX_URL" \
            --output .work/distribution/release-index.json; then
            rm -f .work/distribution/release-index.json
            if gh release view patch-index >/dev/null 2>&1; then
              gh release download patch-index \
                --pattern release-index.json \
                --dir .work/distribution || true
            fi
          fi
          for route in INT_STEAM CN_STEAM INT_ANDROID CN_ANDROID; do
            astral-builder update-index \
              --manifest "output/release/${route}_manifest.json" \
              --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${route}_manifest.json" \
              --index .work/distribution/release-index.json
          done
          python tools/distribution/publish_file.py \
            --source .work/distribution/release-index.json \
            --path release-index.json \
            --message 'chore: update patch distribution index'
          if gh release view patch-index >/dev/null 2>&1; then
            gh release upload patch-index .work/distribution/release-index.json --clobber || \
              echo 'warning: failed to mirror legacy patch-index release' >&2
          fi

  finalize:
    name: Finalize build records
    needs: [plan, index]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.ASTRAL_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.ASTRAL_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-database-tunnel
        with:
          host: ${{ secrets.DB_SSH_HOST }}
          user: ${{ secrets.DB_SSH_USER }}
          private-key: ${{ secrets.DB_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DB_SSH_KNOWN_HOSTS }}
      - uses: ./.github/actions/setup-builder
      - name: Download route build metadata
        uses: actions/download-artifact@v7
        with:
          pattern: patch-build-*
          path: output/release
          merge-multiple: true
      - name: Mark all route builds released
        shell: bash
        run: |
          set -euo pipefail
          for route in INT_STEAM CN_STEAM INT_ANDROID CN_ANDROID; do
            build_id="$(tr -d '\r\n' < "output/release/${route}_build_id.txt")"
            test -n "$build_id"
            astral-builder mark-released --build-id "$build_id"
          done

  notify:
    name: Notify Discord
    needs: [plan, state, finalize]
    if: needs.plan.outputs.should_run == 'true' && needs.finalize.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Send release notification
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: >-
          python tools/workflow/notify_discord.py
          --tag '${{ needs.plan.outputs.tag }}'
          --updated-routes '${{ needs.plan.outputs.updated_routes_csv }}'
          --game-version '${{ needs.plan.outputs.game_version }}'
          --int-steam-revision '${{ needs.state.outputs.int_steam_revision }}'
          --cn-steam-revision '${{ needs.state.outputs.cn_steam_revision }}'
          --int-android-revision '${{ needs.state.outputs.int_android_revision }}'
          --cn-android-revision '${{ needs.state.outputs.cn_android_revision }}'
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
