name: Patch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pre update build or stable release
        required: true
        default: release
        type: choice
        options:
          - release
          - pre

concurrency:
  group: patch-pipeline
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
  DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
  GAME_VERSION: ${{ vars.GAME_VERSION || '3.2.0' }}
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  RELEASE_INDEX_URL: https://raw.githubusercontent.com/${{ github.repository }}/distribution/release-index.json

jobs:
  database:
    name: Database migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
      - name: Apply database migrations
        run: python database/migrate.py

  check:
    name: Check ${{ matrix.route }}
    needs: database
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: INT_STEAM
            slug: int_steam
          - route: CN_STEAM
            slug: cn_steam
          - route: INT_ANDROID
            slug: int_android
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
      - name: Check remote revision and catalog
        run: |
          mkdir -p .work/check
          astral-builder check \
            --route '${{ matrix.route }}' \
            --game-version "$GAME_VERSION" \
            --github-output '.work/check/${{ matrix.slug }}.env'
      - name: Upload route check
        uses: actions/upload-artifact@v7
        with:
          name: patch-check-${{ matrix.slug }}
          path: .work/check/${{ matrix.slug }}.env
          if-no-files-found: error
          retention-days: 1

  plan:
    name: Plan patch run
    needs: check
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.aggregate.outputs.should_run }}
      mode: ${{ steps.release.outputs.mode }}
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      patch_version: ${{ steps.release.outputs.patch_version }}
      game_version: ${{ steps.aggregate.outputs.game_version }}
      max_revision: ${{ steps.aggregate.outputs.max_revision }}
      updated_routes_csv: ${{ steps.aggregate.outputs.updated_routes_csv }}
    steps:
      - uses: actions/checkout@v6
      - name: Download route checks
        uses: actions/download-artifact@v7
        with:
          pattern: patch-check-*
          path: .work/check
          merge-multiple: true
      - name: Aggregate route checks
        id: aggregate
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mode="${REQUESTED_MODE:-release}"
          python tools/workflow/patch_plan.py \
            --checks-dir .work/check \
            --mode "$mode" \
            --github-output "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Define immutable release identity
        if: steps.aggregate.outputs.should_run == 'true'
        id: release
        shell: bash
        env:
          MODE: ${{ steps.aggregate.outputs.mode }}
          VERSION: ${{ steps.aggregate.outputs.game_version }}
          MAX_REVISION: ${{ steps.aggregate.outputs.max_revision }}
        run: |
          set -euo pipefail
          base="v${VERSION}_r${MAX_REVISION}"
          if [ "$MODE" = "pre" ]; then
            tag=patch-pre
            title="${base}-pre"
            patch_version="$title"
            channel=develop
          else
            channel=release
            mkdir -p .work
            git ls-remote --tags --refs origin "refs/tags/${base}*" \
              | awk '{sub("refs/tags/", "", $2); print $2}' > .work/existing-patch-tags.txt
            tag="$(python tools/workflow/release_tag.py \
              --base "$base" \
              --tags-file .work/existing-patch-tags.txt)"
            title="$tag"
            patch_version="$tag"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "patch_version=$patch_version" >> "$GITHUB_OUTPUT"
      - name: No route update detected
        if: steps.aggregate.outputs.should_run != 'true'
        run: echo 'All routes already have a published build for their current revisions.'

  sync:
    name: Sync ${{ matrix.route }}
    needs: [check, plan]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: INT_STEAM
            slug: int_steam
            config: routes/int_steam.yaml
          - route: CN_STEAM
            slug: cn_steam
            config: routes/cn_steam.yaml
          - route: INT_ANDROID
            slug: int_android
            config: routes/int_android.yaml
    steps:
      - uses: actions/checkout@v6
      - name: Download route check
        uses: actions/download-artifact@v7
        with:
          name: patch-check-${{ matrix.slug }}
          path: .work/check
      - name: Determine whether full sync is required
        id: current
        shell: bash
        run: |
          set -euo pipefail
          file='.work/check/${{ matrix.slug }}.env'
          sync_required="$(sed -n 's/^sync_required=//p' "$file" | tail -1)"
          test "$sync_required" = true -o "$sync_required" = false
          echo "sync_required=$sync_required" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-builder
        if: steps.current.outputs.sync_required == 'true'
      - name: Synchronize route resources
        if: steps.current.outputs.sync_required == 'true'
        run: |
          mkdir -p .work/state
          astral-builder sync \
            --game-version "$GAME_VERSION" \
            --route-config '${{ matrix.config }}' \
            --work-dir '.work/sync-${{ matrix.slug }}' \
            --github-output '.work/state/${{ matrix.slug }}.env'
      - name: Reuse already synchronized route state
        if: steps.current.outputs.sync_required != 'true'
        shell: bash
        run: |
          mkdir -p .work/state
          cp '.work/check/${{ matrix.slug }}.env' '.work/state/${{ matrix.slug }}.env'
          {
            echo 'source_added=0'
            echo 'source_modified=0'
            echo 'source_removed=0'
          } >> '.work/state/${{ matrix.slug }}.env'
      - name: Upload synchronized route state
        uses: actions/upload-artifact@v7
        with:
          name: patch-state-${{ matrix.slug }}
          path: .work/state/${{ matrix.slug }}.env
          if-no-files-found: error
          retention-days: 1

  state:
    name: Collect route state
    needs: [plan, sync]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      int_steam_revision_id: ${{ steps.collect.outputs.int_steam_revision_id }}
      cn_steam_revision_id: ${{ steps.collect.outputs.cn_steam_revision_id }}
      int_android_revision_id: ${{ steps.collect.outputs.int_android_revision_id }}
      int_steam_revision: ${{ steps.collect.outputs.int_steam_revision }}
      cn_steam_revision: ${{ steps.collect.outputs.cn_steam_revision }}
      int_android_revision: ${{ steps.collect.outputs.int_android_revision }}
      source_added: ${{ steps.collect.outputs.source_added }}
      source_modified: ${{ steps.collect.outputs.source_modified }}
      source_removed: ${{ steps.collect.outputs.source_removed }}
      translation_total: ${{ steps.translations.outputs.total }}
      translation_approved: ${{ steps.translations.outputs.approved }}
      translation_untranslated: ${{ steps.translations.outputs.untranslated }}
      translation_pending: ${{ steps.translations.outputs.pending }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
      - name: Download route states
        uses: actions/download-artifact@v7
        with:
          pattern: patch-state-*
          path: .work/state
          merge-multiple: true
      - name: Collect route revision IDs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          read_output() {
            local file="$1"
            local key="$2"
            sed -n "s/^${key}=//p" "$file" | tail -1
          }
          for slug in int_steam cn_steam int_android; do
            file=".work/state/${slug}.env"
            revision_id="$(read_output "$file" revision_id)"
            revision="$(read_output "$file" revision)"
            test -n "$revision_id"
            test -n "$revision"
            echo "${slug}_revision_id=$revision_id" >> "$GITHUB_OUTPUT"
            echo "${slug}_revision=$revision" >> "$GITHUB_OUTPUT"
          done
          for key in source_added source_modified source_removed; do
            value="$(read_output .work/state/int_steam.env "$key")"
            echo "$key=${value:-0}" >> "$GITHUB_OUTPUT"
          done
      - name: Report production translation state
        id: translations
        run: >-
          astral-builder translation-status
          --revision-id '${{ steps.collect.outputs.int_steam_revision_id }}'
          --github-output "$GITHUB_OUTPUT"
      - name: Write state summary
        shell: bash
        run: |
          {
            echo '## Patch state'
            echo
            echo "- Release: \`${{ needs.plan.outputs.title }}\`"
            echo "- Highest route revision: \`r${{ needs.plan.outputs.max_revision }}\`"
            echo "- INT_STEAM source changes: \`+${{ steps.collect.outputs.source_added }} / ~${{ steps.collect.outputs.source_modified }} / -${{ steps.collect.outputs.source_removed }}\`"
            echo "- Production translations: \`${{ steps.translations.outputs.approved }} / ${{ steps.translations.outputs.total }}\`"
            echo "- Pending proposals: \`${{ steps.translations.outputs.pending }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  steam-inputs:
    name: Fetch Steam legacy inputs
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      DEPOTDOWNLOADER_LOGIN_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Download both data.unity3d files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STEAM_USERNAME"
          test -n "$DEPOTDOWNLOADER_LOGIN_TOKEN"
          git clone --filter=blob:none https://github.com/SteamRE/DepotDownloader.git .work/DepotDownloader
          git -C .work/DepotDownloader checkout --detach c553ef4d60c00a4f5fd16c9fe017f569001589ff
          git -C .work/DepotDownloader apply "$GITHUB_WORKSPACE/tools/depotdownloader-ci.patch"
          test "$(git -C .work/DepotDownloader rev-parse HEAD)" = c553ef4d60c00a4f5fd16c9fe017f569001589ff
          dotnet build .work/DepotDownloader/DepotDownloader/DepotDownloader.csproj -c Release --nologo
          mkdir -p .work/steam-download
          cat > .work/legacy-filelist.txt <<'EOF'
          8vJXnINT/AstralParty_INT_Data/data.unity3d
          8vJXn6CN/AstralParty_CN_Data/data.unity3d
          EOF
          dotnet run \
            --project .work/DepotDownloader/DepotDownloader/DepotDownloader.csproj \
            -c Release \
            --no-build \
            -- \
            -app 2622000 \
            -depot 2622001 \
            -username "$STEAM_USERNAME" \
            -remember-password \
            -os windows \
            -filelist .work/legacy-filelist.txt \
            -dir .work/steam-download
          test -s .work/steam-download/8vJXnINT/AstralParty_INT_Data/data.unity3d
          test -s .work/steam-download/8vJXn6CN/AstralParty_CN_Data/data.unity3d
      - name: Upload INT_STEAM legacy input
        uses: actions/upload-artifact@v7
        with:
          name: patch-steam-int_steam
          path: .work/steam-download/8vJXnINT/AstralParty_INT_Data/data.unity3d
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload CN_STEAM legacy input
        uses: actions/upload-artifact@v7
        with:
          name: patch-steam-cn_steam
          path: .work/steam-download/8vJXn6CN/AstralParty_CN_Data/data.unity3d
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-steam:
    name: Build ${{ matrix.route }}
    needs: [plan, state, steam-inputs]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: INT_STEAM
            slug: int_steam
            config: routes/int_steam.yaml
            legacy_artifact: patch-steam-int_steam
            legacy_dir: .work/steam-download/8vJXnINT/AstralParty_INT_Data
            legacy_path: .work/steam-download/8vJXnINT/AstralParty_INT_Data/data.unity3d
          - route: CN_STEAM
            slug: cn_steam
            config: routes/cn_steam.yaml
            legacy_artifact: patch-steam-cn_steam
            legacy_dir: .work/steam-download/8vJXn6CN/AstralParty_CN_Data
            legacy_path: .work/steam-download/8vJXn6CN/AstralParty_CN_Data/data.unity3d
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
      - name: Download route Steam input
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.legacy_artifact }}
          path: ${{ matrix.legacy_dir }}
      - name: Build and validate
        id: build
        shell: bash
        env:
          INT_STEAM_REVISION_ID: ${{ needs.state.outputs.int_steam_revision_id }}
          CN_STEAM_REVISION_ID: ${{ needs.state.outputs.cn_steam_revision_id }}
        run: |
          set -euo pipefail
          case '${{ matrix.route }}' in
            INT_STEAM) REVISION_ID="$INT_STEAM_REVISION_ID" ;;
            CN_STEAM) REVISION_ID="$CN_STEAM_REVISION_ID" ;;
            *) echo 'unsupported Steam route' >&2; exit 1 ;;
          esac
          root='output/patch/${{ matrix.slug }}'
          output_file='.work/build-output.env'
          asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.plan.outputs.tag }}"
          astral-builder build \
            --revision-id "$REVISION_ID" \
            --route-config '${{ matrix.config }}' \
            --work-dir '.work/build-${{ matrix.slug }}' \
            --output-dir "$root" \
            --asset-base-url "$asset_base" \
            --patch-version '${{ needs.plan.outputs.patch_version }}' \
            --github-run-id "$GITHUB_RUN_ID" \
            --git-commit "$GITHUB_SHA" \
            --channel '${{ needs.plan.outputs.channel }}' \
            --legacy-data '${{ matrix.legacy_path }}' \
            --github-output "$output_file"
          astral-builder validate-build \
            --manifest "$root/manifest.json" \
            --assets-dir "$root/assets" \
            --route-config '${{ matrix.config }}'
          mkdir -p output/release
          cp "$root/manifest.json" 'output/release/${{ matrix.route }}_manifest.json'
          cp "$root"/assets/* output/release/
          build_id="$(sed -n 's/^build_id=//p' "$output_file" | tail -1)"
          test -n "$build_id"
          printf '%s\n' "$build_id" > 'output/release/${{ matrix.route }}_build_id.txt'
      - name: Upload route build
        uses: actions/upload-artifact@v7
        with:
          name: patch-build-${{ matrix.slug }}
          path: output/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-android:
    name: Build INT_ANDROID
    needs: [plan, state]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
      - name: Build and validate
        shell: bash
        run: |
          set -euo pipefail
          root=output/patch/int_android
          output_file=.work/build-output.env
          asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.plan.outputs.tag }}"
          astral-builder build \
            --revision-id '${{ needs.state.outputs.int_android_revision_id }}' \
            --route-config routes/int_android.yaml \
            --work-dir .work/build-int_android \
            --output-dir "$root" \
            --asset-base-url "$asset_base" \
            --patch-version '${{ needs.plan.outputs.patch_version }}' \
            --github-run-id "$GITHUB_RUN_ID" \
            --git-commit "$GITHUB_SHA" \
            --channel '${{ needs.plan.outputs.channel }}' \
            --github-output "$output_file"
          astral-builder validate-build \
            --manifest "$root/manifest.json" \
            --assets-dir "$root/assets" \
            --route-config routes/int_android.yaml
          mkdir -p output/release
          cp "$root/manifest.json" output/release/INT_ANDROID_manifest.json
          cp "$root"/assets/* output/release/
          build_id="$(sed -n 's/^build_id=//p' "$output_file" | tail -1)"
          test -n "$build_id"
          printf '%s\n' "$build_id" > output/release/INT_ANDROID_build_id.txt
      - name: Upload route build
        uses: actions/upload-artifact@v7
        with:
          name: patch-build-int_android
          path: output/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [plan, state, build-steam, build-android]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download all route builds
        uses: actions/download-artifact@v7
        with:
          pattern: patch-build-*
          path: output/release
          merge-multiple: true
      - name: Verify complete release set
        run: |
          set -euo pipefail
          for route in INT_STEAM CN_STEAM INT_ANDROID; do
            test -s "output/release/${route}_manifest.json"
            test -s "output/release/${route}_build_id.txt"
          done
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          python tools/workflow/release_notes.py patch \
            --output .work/patch-release-notes.md \
            --updated-routes '${{ needs.plan.outputs.updated_routes_csv }}' \
            --game-version '${{ needs.plan.outputs.game_version }}' \
            --int-steam-revision '${{ needs.state.outputs.int_steam_revision }}' \
            --cn-steam-revision '${{ needs.state.outputs.cn_steam_revision }}' \
            --int-android-revision '${{ needs.state.outputs.int_android_revision }}' \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"
      - name: Publish release
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "pre" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --yes --cleanup-tag
            elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git push origin ":refs/tags/$TAG"
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1 || \
               git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "immutable release tag already exists: $TAG" >&2
              exit 1
            fi
          fi

          cleanup() {
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          }
          trap cleanup ERR
          args=(
            release create "$TAG"
            --draft
            --target "$GITHUB_SHA"
            --title "$TITLE"
            --notes-file .work/patch-release-notes.md
          )
          if [ "$MODE" = "pre" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
          find output/release -maxdepth 1 -type f -name '*_build_id.txt' -delete
          gh release upload "$TAG" output/release/*
          gh release edit "$TAG" --draft=false
          trap - ERR

  index:
    name: Update distribution index
    needs: [plan, publish]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
      - name: Download route builds
        uses: actions/download-artifact@v7
        with:
          pattern: patch-build-*
          path: output/release
          merge-multiple: true
      - name: Update shared patch release index
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .work/distribution
          if ! curl --fail --location --silent --show-error \
            "$RELEASE_INDEX_URL" \
            --output .work/distribution/release-index.json; then
            rm -f .work/distribution/release-index.json
            if gh release view patch-index >/dev/null 2>&1; then
              gh release download patch-index \
                --pattern release-index.json \
                --dir .work/distribution || true
            fi
          fi
          for route in INT_STEAM CN_STEAM INT_ANDROID; do
            astral-builder update-index \
              --manifest "output/release/${route}_manifest.json" \
              --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${route}_manifest.json" \
              --index .work/distribution/release-index.json
          done
          python tools/distribution/publish_file.py \
            --source .work/distribution/release-index.json \
            --path release-index.json \
            --message 'chore: update patch distribution index'
          if gh release view patch-index >/dev/null 2>&1; then
            gh release upload patch-index .work/distribution/release-index.json --clobber || \
              echo 'warning: failed to mirror legacy patch-index release' >&2
          fi

  finalize:
    name: Finalize build records
    needs: [plan, index]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
      - name: Download route build metadata
        uses: actions/download-artifact@v7
        with:
          pattern: patch-build-*
          path: output/release
          merge-multiple: true
      - name: Mark all route builds released
        shell: bash
        run: |
          set -euo pipefail
          for route in INT_STEAM CN_STEAM INT_ANDROID; do
            build_id="$(tr -d '\r\n' < "output/release/${route}_build_id.txt")"
            test -n "$build_id"
            astral-builder mark-released --build-id "$build_id"
          done
