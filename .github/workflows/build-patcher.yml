name: Build Patcher

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the portable EXE as an immutable GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: patcher
    env:
      GH_TOKEN: ${{ github.token }}
      ASTRAL_PATCH_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/patch-index/release-index.json
      ASTRAL_PATCHER_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/patcher-index/patcher-index.json
      ASTRAL_PATCHER_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Read patcher version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargo = Get-Content 'Cargo.toml' -Raw
          $cargoMatch = [regex]::Match(
            $cargo,
            '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"'
          )
          if (-not $cargoMatch.Success) {
            throw 'Could not read the Cargo package version.'
          }
          $version = $cargoMatch.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=patcher-v$version" >> $env:GITHUB_OUTPUT
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --locked --all-targets --all-features
      - name: Rust clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build portable EXE
        run: cargo build --locked --release --bin AstralAutoPatcher
      - name: Verify EXE
        id: executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'target/release/AstralAutoPatcher.exe'
          if ($exe.Length -le 0) {
            throw 'AstralAutoPatcher.exe is empty.'
          }
          $sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
          "size=$($exe.Length)" >> $env:GITHUB_OUTPUT
          Write-Host "Executable: $($exe.Name)"
          Write-Host "SHA-256: $sha256"
      - name: Upload portable patcher artifact
        uses: actions/upload-artifact@v7
        with:
          name: AstralAutoPatcher-${{ steps.version.outputs.version }}-windows-x64
          path: ${{ steps.executable.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish immutable patcher release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXE: ${{ steps.executable.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:TAG already exists; patcher releases are immutable."
          }
          git ls-remote --exit-code --tags origin "refs/tags/$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $env:TAG already exists; patcher release tags are immutable."
          }
          gh release create $env:TAG `
            $env:EXE `
            --target $env:GITHUB_SHA `
            --title "AstralAutoPatcher $env:VERSION" `
            --notes "Portable Windows x64 AstralAutoPatcher $env:VERSION. Includes automatic verified self-update, release-channel patch installation with download/apply progress, LocalAppData self-registration, and astral:// protocol integration."
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish patcher release $env:TAG."
          }

      - name: Update automatic patcher index
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.executable.outputs.sha256 }}
          SIZE: ${{ steps.executable.outputs.size }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $indexPath = Join-Path $env:RUNNER_TEMP 'patcher-index.json'
          $metadata = [ordered]@{
            schemaVersion = 1
            version = $env:VERSION
            downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/AstralAutoPatcher.exe"
            sha256 = $env:SHA256
            size = [int64]$env:SIZE
          }
          $metadata | ConvertTo-Json | Set-Content -Path $indexPath -Encoding utf8NoBOM

          gh release view patcher-index *> $null
          if ($LASTEXITCODE -ne 0) {
            git ls-remote --exit-code --tags origin refs/tags/patcher-index *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release create patcher-index `
                --verify-tag `
                --title "Patcher Index" `
                --notes "Machine-readable AstralAutoPatcher update index" `
                --prerelease
            } else {
              gh release create patcher-index `
                --target $env:GITHUB_SHA `
                --title "Patcher Index" `
                --notes "Machine-readable AstralAutoPatcher update index" `
                --prerelease
            }
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to create patcher-index release.'
            }
          }
          gh release upload patcher-index $indexPath --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to update patcher-index.json.'
          }
