name: Build Patcher

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the portable EXE as an immutable GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: patcher
    env:
      GH_TOKEN: ${{ github.token }}
      ASTRAL_PATCH_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/patch-index/release-index.json
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Read patcher version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargo = Get-Content 'Cargo.toml' -Raw
          $cargoMatch = [regex]::Match(
            $cargo,
            '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"'
          )
          if (-not $cargoMatch.Success) {
            throw 'Could not read the Cargo package version.'
          }
          $version = $cargoMatch.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=patcher-v$version" >> $env:GITHUB_OUTPUT
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --all-targets --all-features
      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build portable EXE
        run: cargo build --release --bin AstralAutoPatcher
      - name: Verify EXE and write checksum
        id: executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'target/release/AstralAutoPatcher.exe'
          if ($exe.Length -le 0) {
            throw 'AstralAutoPatcher.exe is empty.'
          }
          $sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$($exe.FullName).sha256"
          "$sha256  $($exe.Name)" | Set-Content -Path $checksum -Encoding ascii
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
          Write-Host "Executable: $($exe.Name)"
          Write-Host "SHA-256: $sha256"
      - name: Upload portable patcher artifact
        uses: actions/upload-artifact@v7
        with:
          name: AstralAutoPatcher-${{ steps.version.outputs.version }}-windows-x64
          path: |
            ${{ steps.executable.outputs.path }}
            ${{ steps.executable.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish immutable patcher release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXE: ${{ steps.executable.outputs.path }}
          CHECKSUM: ${{ steps.executable.outputs.checksum }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:TAG already exists; patcher releases are immutable."
          }
          gh release create $env:TAG `
            $env:EXE `
            $env:CHECKSUM `
            --target $env:GITHUB_SHA `
            --title "AstralAutoPatcher $env:VERSION" `
            --notes "Portable Windows x64 AstralAutoPatcher $env:VERSION. First launch self-registers under LocalAppData and registers the astral:// protocol."
