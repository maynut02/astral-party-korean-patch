name: Android APK

on:
  workflow_dispatch:

concurrency:
  group: android-game-original-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_PACKAGE: com.feimo.astralpartyjpn
      APKEEP_IMAGE: ghcr.io/efforg/apkeep:stable
      DEVICE_PROFILE: px_9a
      PLAY_OPTIONS: device=px_9a,locale=ja_JP,timezone=Asia/Tokyo,split_apk=true,include_additional_files=true
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v6

      - uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: bash
        run: sdkmanager "build-tools;36.0.0"

      - name: Validate Google Play credentials
        shell: bash
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          AAS_TOKEN: ${{ secrets.AAS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PLAY_EMAIL"
          test -n "$AAS_TOKEN"

      - name: Download untouched Google Play split APKs
        shell: bash
        env:
          PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
          AAS_TOKEN: ${{ secrets.AAS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .work/google-play
          docker pull "$APKEEP_IMAGE"
          docker run --rm \
            -v "$PWD/.work/google-play:/output" \
            "$APKEEP_IMAGE" \
            -a "$ANDROID_PACKAGE" \
            -d google-play \
            -o "$PLAY_OPTIONS" \
            -e "$PLAY_EMAIL" \
            -t "$AAS_TOKEN" \
            /output
          find .work/google-play -type f -name '*.apk' -print
          if find .work/google-play -type f -name '*.obb' -print -quit | grep -q .; then
            echo 'Google Play returned OBB files; this installer only supports APK splits.' >&2
            exit 1
          fi

      - name: Validate and prepare immutable release assets
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/release
          python tools/android/prepare_original_apks.py \
            --input-dir .work/google-play \
            --output-dir .work/release \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --device-profile "$DEVICE_PROFILE" \
            > .work/metadata.json

          TAG="$(jq -r '.releaseTag' .work/metadata.json)"
          VERSION_NAME="$(jq -r '.versionName' .work/metadata.json)"
          VERSION_CODE="$(jq -r '.versionCode' .work/metadata.json)"
          CERTIFICATE_SHA256="$(jq -r '.certificateSha256' .work/metadata.json)"
          FILE_COUNT="$(jq -r '.files | length' .work/metadata.json)"
          test "$TAG" = "android-game-v${VERSION_CODE}"
          test "$FILE_COUNT" -gt 0

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "certificate_sha256=$CERTIFICATE_SHA256" >> "$GITHUB_OUTPUT"
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Refuse mutable game releases
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          CERTIFICATE_SHA256: ${{ steps.metadata.outputs.certificate_sha256 }}
          FILE_COUNT: ${{ steps.metadata.outputs.file_count }}
        run: |
          set -euo pipefail
          python tools/workflow/release_notes.py android-apk \
            --output "$RUNNER_TEMP/android-game-release-notes.md" \
            --version "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --file-count "$FILE_COUNT" \
            --device-profile "$DEVICE_PROFILE" \
            --certificate-sha256 "$CERTIFICATE_SHA256" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Publish immutable original APK release
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            .work/release/* \
            --target "$GITHUB_SHA" \
            --title "apk-INT_ANDROID v${VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/android-game-release-notes.md"

      - name: Update original game distribution index
        shell: bash
        run: |
          set -euo pipefail
          python tools/distribution/publish_file.py \
            --source .work/release/AstralPartyOriginal.json \
            --path android-game-index.json \
            --message "chore: update original Android game index"
