name: Release Preview Patch

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision_id: ${{ steps.revision.outputs.revision_id }}
      game_version: ${{ steps.revision.outputs.game_version }}
      revision: ${{ steps.revision.outputs.revision }}
      patch_version: ${{ steps.revision.outputs.patch_version }}
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - name: Install builder
        run: python -m pip install -e './builder[dev]'
      - name: Apply database migrations
        run: python database/migrate.py
      - name: Resolve latest processed revision
        id: revision
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          route = "INT_STEAM"
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute(
                  """
                  SELECT id::text, game_version, revision
                  FROM game_revisions
                  WHERE route = %s AND processed_at IS NOT NULL
                  ORDER BY detected_at DESC, processed_at DESC, id DESC
                  LIMIT 1
                  """,
                  (route,),
              )
              row = cur.fetchone()

          if row is None:
              raise SystemExit(f"No processed game revision found for route {route}")

          revision_id, game_version, revision = map(str, row)
          patch_version = (
              f"v{game_version}-r{revision}-preview.manual."
              f"{os.environ['GITHUB_RUN_NUMBER']}"
          )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"revision_id={revision_id}\n")
              handle.write(f"game_version={game_version}\n")
              handle.write(f"revision={revision}\n")
              handle.write(f"patch_version={patch_version}\n")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Preview release target\n\n")
              handle.write(f"- Revision ID: `{revision_id}`\n")
              handle.write(f"- Game version: `{game_version}`\n")
              handle.write(f"- Revision: `{revision}`\n")
              handle.write(f"- Patch version: `{patch_version}`\n")
          PY

  legacy:
    needs: resolve
    uses: ./.github/workflows/fetch-legacy-data.yml
    secrets: inherit

  build-preview:
    needs: [resolve, legacy]
    uses: ./.github/workflows/build-patch.yml
    with:
      revision_id: ${{ needs.resolve.outputs.revision_id }}
      patch_version: ${{ needs.resolve.outputs.patch_version }}
      channel: preview
      legacy_run_id: ${{ needs.legacy.outputs.run_id }}
      legacy_artifact_name: ${{ needs.legacy.outputs.artifact_name }}
    secrets: inherit

  release-preview:
    needs: build-preview
    uses: ./.github/workflows/release-patch.yml
    with:
      build_run_id: ${{ github.run_id }}
      artifact_name: ${{ needs.build-preview.outputs.artifact_name }}
    secrets: inherit
