name: Process Route

on:
  workflow_call:
    inputs:
      route:
        required: true
        type: string
      route_config:
        required: true
        type: string
      game_version:
        required: true
        type: string
      tag_suffix:
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      game_version: ${{ steps.check.outputs.game_version }}
      revision: ${{ steps.check.outputs.revision }}
      catalog_hash: ${{ steps.check.outputs.catalog_hash }}
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - name: Install builder
        run: python -m pip install -e './builder[dev]'
      - name: Apply database migrations
        run: python database/migrate.py
      - name: Check remote revision
        id: check
        run: >-
          astral-builder check
          --route '${{ inputs.route }}'
          --game-version '${{ inputs.game_version }}'
          --github-output "$GITHUB_OUTPUT"

  sync:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/sync-game.yml
    with:
      game_version: ${{ needs.check.outputs.game_version }}
      route_config: ${{ inputs.route_config }}
    secrets: inherit

  legacy:
    needs: sync
    uses: ./.github/workflows/fetch-legacy-data.yml
    with:
      route: ${{ inputs.route }}
    secrets: inherit

  build-pre:
    needs: [sync, legacy]
    uses: ./.github/workflows/build-patch.yml
    with:
      revision_id: ${{ needs.sync.outputs.revision_id }}
      route_config: ${{ inputs.route_config }}
      patch_version: ${{ format('v{0}-r{1}{2}-pre', needs.sync.outputs.game_version, needs.sync.outputs.revision, inputs.tag_suffix) }}
      channel: release
      legacy_run_id: ${{ needs.legacy.outputs.run_id }}
      legacy_artifact_name: ${{ needs.legacy.outputs.artifact_name }}
    secrets: inherit

  release-pre:
    needs: build-pre
    uses: ./.github/workflows/release-patch.yml
    with:
      build_run_id: ${{ github.run_id }}
      artifact_name: ${{ needs.build-pre.outputs.artifact_name }}
      route_config: ${{ inputs.route_config }}
    secrets: inherit
