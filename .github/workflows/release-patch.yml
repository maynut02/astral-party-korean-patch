name: Release Patch

on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Workflow run ID that produced the validated patch artifact
        required: true
        type: string
      artifact_name:
        description: Validated patch artifact name
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - name: Install builder
        run: python -m pip install -e './builder[dev]'
      - name: Download validated patch artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: .work/release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Locate patch artifact
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find .work/release -type f -name manifest.json -print -quit)"
          test -n "$manifest"
          root="$(dirname "$manifest")"
          test -d "$root/assets"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Validate patch again before release
        run: >-
          astral-builder validate-build
          --manifest '${{ steps.patch.outputs.manifest }}'
          --assets-dir '${{ steps.patch.outputs.root }}/assets'
          --route-config routes/int_steam.yaml
      - name: Read release metadata
        id: metadata
        run: >-
          astral-builder release-info
          --manifest '${{ steps.patch.outputs.manifest }}'
          --github-output "$GITHUB_OUTPUT"
      - name: Verify release asset URLs
        shell: bash
        env:
          MANIFEST: ${{ steps.patch.outputs.manifest }}
          TAG: ${{ steps.metadata.outputs.patch_version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          prefix = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['TAG']}/"
          )
          bad = [
              item["downloadUrl"]
              for item in data["files"]
              if not item["downloadUrl"].startswith(prefix)
          ]
          if bad:
              raise SystemExit(f"manifest contains unexpected release URLs: {bad}")
          PY
      - name: Create GitHub Release if needed
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.patch_version }}
          CHANNEL: ${{ steps.metadata.outputs.channel }}
          GAME_VERSION: ${{ steps.metadata.outputs.game_version }}
          REVISION: ${{ steps.metadata.outputs.revision }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          args=(
            release create "$TAG"
            --target "$GITHUB_SHA"
            --title "$TAG"
            --notes "Astral Party ${GAME_VERSION} revision ${REVISION}"
          )
          if [ "$CHANNEL" = "preview" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
      - name: Upload immutable patch release files
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.patch_version }}
          ROOT: ${{ steps.patch.outputs.root }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ROOT"/assets/* "$ROOT"/manifest.json
      - name: Prepare patch index release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/index
          if ! gh release view patch-index >/dev/null 2>&1; then
            gh release create patch-index \
              --target "$GITHUB_SHA" \
              --title "Patch Index" \
              --notes "Machine-readable patch index" \
              --prerelease
          fi
          gh release download patch-index --pattern release-index.json --dir .work/index || true
      - name: Update release index
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.patch_version }}
          MANIFEST: ${{ steps.patch.outputs.manifest }}
        run: >-
          astral-builder update-index
          --manifest "$MANIFEST"
          --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/manifest.json"
          --index .work/index/release-index.json
      - name: Upload updated release index
        run: gh release upload patch-index .work/index/release-index.json --clobber
      - name: Mark Neon build released
        run: >-
          astral-builder mark-released
          --build-id '${{ steps.metadata.outputs.build_id }}'
