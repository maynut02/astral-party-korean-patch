name: AndroidPatcher

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: android-patcher-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.apk.outputs.version_code }}
      sha256: ${{ steps.apk.outputs.sha256 }}
      size: ${{ steps.apk.outputs.size }}
    defaults:
      run:
        working-directory: android-patcher

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve next AndroidPatcher version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          versions="$(
            gh release list --limit 1000 --json tagName --jq '.[].tagName' \
              | sed -nE 's/^android-patcher-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
              | sort -V
          )"

          current=""
          if [[ -n "$versions" ]]; then
            current="$(printf '%s\n' "$versions" | tail -n 1)"
          fi

          index_version="$(
            gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/mobile-patcher-index.json?ref=distribution" \
              2>/dev/null \
              | jq -r '.version // empty' \
              || true
          )"
          if [[ "$index_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            current="$(printf '%s\n' "$current" "$index_version" | sed '/^$/d' | sort -V | tail -n 1)"
          fi

          if [[ -z "$current" ]]; then
            current_label="none"
            version="0.1.0"
          else
            current_label="$current"
            IFS='.' read -r major minor patch <<< "$current"

            case "$BUMP" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                echo "Unsupported version bump: $BUMP" >&2
                exit 1
                ;;
            esac

            version="${major}.${minor}.${patch}"
          fi

          tag="android-patcher-v${version}"
          if gh release view "$tag" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release or tag already exists: $tag" >&2
            exit 1
          fi

          echo "AndroidPatcher version: ${current_label} -> ${version} (${BUMP})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test and build signed release APK
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/astral-android-patcher.keystore"
          trap 'truncate -s 0 "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PversionName="$VERSION"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk \
            "AstralAndroidPatcher.apk"

      - name: Read release APK metadata
        id: apk
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          APK="AstralAndroidPatcher.apk"
          test -s "$APK"

          VERSION_CODE="$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
              | sed -nE "s/^package: name='[^']+' versionCode='([0-9]+)'.*/\1/p" \
              | head -n 1
          )"
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Could not read versionCode from $APK" >&2
            exit 1
          fi

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK")"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "APK versionCode: $VERSION_CODE"
          echo "APK SHA-256: $SHA256"
          echo "APK size: $SIZE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstralAndroidPatcher-v${{ steps.version.outputs.version }}
          path: android-patcher/AstralAndroidPatcher.apk
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: AstralAndroidPatcher-v${{ needs.build.outputs.version }}

      - name: Verify release artifact
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail

          APK="AstralAndroidPatcher.apk"
          test -s "$APK"

          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c '%s' "$APK")"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "Release artifact SHA-256 mismatch." >&2
            exit 1
          fi
          if [[ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]]; then
            echo "Release artifact size mismatch." >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          python tools/workflow/release_notes.py android-patcher \
            --output "$RUNNER_TEMP/android-patcher-release-notes.md" \
            --version "$VERSION" \
            --version-code "$VERSION_CODE" \
            --sha256 "$SHA256" \
            --size "$SIZE" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

          gh release create "$TAG" \
            "AstralAndroidPatcher.apk" \
            --target "$GITHUB_SHA" \
            --title "AndroidPatcher v${VERSION}" \
            --notes-file "$RUNNER_TEMP/android-patcher-release-notes.md"

      - name: Update AndroidPatcher distribution index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail

          INDEX="$RUNNER_TEMP/mobile-patcher-index.json"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/AstralAndroidPatcher.apk"
          python3 - "$INDEX" "$VERSION" "$VERSION_CODE" "$DOWNLOAD_URL" "$SHA256" "$SIZE" <<'PYINDEX'
          import json
          import sys

          path, version, version_code, url, sha256, size = sys.argv[1:]
          payload = {
              "version": version,
              "versionCode": int(version_code),
              "downloadUrl": url,
              "sha256": sha256,
              "size": int(size),
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PYINDEX

          python tools/distribution/publish_file.py \
            --source "$INDEX" \
            --path mobile-patcher-index.json \
            --message "chore: update AndroidPatcher distribution index"
