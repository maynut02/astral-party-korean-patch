name: Mobile Patcher

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: mobile-patcher-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: mobile-patcher

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve next Mobile Patcher version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          versions="$(
            gh release list --limit 1000 --json tagName --jq '.[].tagName' \
              | sed -nE 's/^mobile-patcher-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
              | sort -V
          )"

          if [[ -z "$versions" ]]; then
            current="none"
            version="0.1.0"
          else
            current="$(printf '%s\n' "$versions" | tail -n 1)"
            IFS='.' read -r major minor patch <<< "$current"

            case "$BUMP" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                echo "Unsupported version bump: $BUMP" >&2
                exit 1
                ;;
            esac

            version="${major}.${minor}.${patch}"
          fi

          tag="mobile-patcher-v${version}"
          if gh release view "$tag" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release or tag already exists: $tag" >&2
            exit 1
          fi

          echo "Mobile Patcher version: ${current} -> ${version} (${BUMP})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test and build signed release APK
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/astral-mobile-patcher.keystore"
          trap 'truncate -s 0 "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PversionName="$VERSION"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk \
            "AstralMobilePatcher-v${VERSION}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstralMobilePatcher-v${{ steps.version.outputs.version }}
          path: mobile-patcher/AstralMobilePatcher-v${{ steps.version.outputs.version }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: AstralMobilePatcher-v${{ needs.build.outputs.version }}

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "AstralMobilePatcher-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Astral Mobile Patcher v${VERSION}" \
            --notes "Android용 Astral Mobile Patcher 릴리즈입니다."
