name: Build Patch

on:
  workflow_call:
    inputs:
      revision_id:
        required: true
        type: string
      patch_version:
        required: true
        type: string
      channel:
        required: true
        type: string
      legacy_run_id:
        required: true
        type: string
      legacy_artifact_name:
        required: false
        default: astral-party-legacy-data
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
      build_id:
        value: ${{ jobs.build.outputs.build_id }}
  workflow_dispatch:
    inputs:
      revision_id:
        description: Processed Neon game revision UUID
        required: true
        type: string
      patch_version:
        description: Patch version/tag to build
        required: true
        type: string
      channel:
        description: Translation channel
        required: true
        default: preview
        type: choice
        options: [preview, stable]
      legacy_run_id:
        description: Workflow run ID containing the legacy data.unity3d artifact
        required: true
        type: string
      legacy_artifact_name:
        description: Artifact containing data.unity3d
        required: true
        default: astral-party-legacy-data
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      build_id: ${{ steps.build.outputs.build_id }}
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - name: Install builder
        run: python -m pip install -e './builder[dev]'
      - name: Download legacy game data artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.legacy_artifact_name }}
          path: .work/legacy
          github-token: ${{ github.token }}
          run-id: ${{ inputs.legacy_run_id }}
      - name: Locate legacy data.unity3d
        id: legacy
        shell: bash
        run: |
          set -euo pipefail
          path="$(find .work/legacy -type f -name data.unity3d -print -quit)"
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Build complete patch
        id: build
        shell: bash
        env:
          ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.patch_version }}
        run: >-
          astral-builder build
          --revision-id '${{ inputs.revision_id }}'
          --route-config routes/int_steam.yaml
          --work-dir .work/build
          --output-dir output/patch
          --asset-base-url "$ASSET_BASE_URL"
          --patch-version '${{ inputs.patch_version }}'
          --github-run-id '${{ github.run_id }}'
          --git-commit '${{ github.sha }}'
          --channel '${{ inputs.channel }}'
          --legacy-data '${{ steps.legacy.outputs.path }}'
          --github-output "$GITHUB_OUTPUT"
      - name: Validate built patch in fresh process
        run: >-
          astral-builder validate-build
          --manifest output/patch/manifest.json
          --assets-dir output/patch/assets
          --route-config routes/int_steam.yaml
      - name: Define patch artifact metadata
        id: meta
        shell: bash
        run: echo "artifact_name=patch-${{ inputs.patch_version }}-${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
      - name: Write patch size summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("output/patch/manifest.json").read_text(encoding="utf-8"))
          rows = []
          total_download = 0
          total_payload = 0
          for item in manifest["files"]:
              download_size = int(item["downloadSize"])
              payload_size = int(item["size"])
              total_download += download_size
              total_payload += payload_size
              ratio = (download_size / payload_size * 100) if payload_size else 0
              rows.append((item["target"], item["path"], download_size, payload_size, ratio))

          def mib(value: int) -> str:
              return f"{value / 1024 / 1024:.2f} MiB"

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Patch transfer sizes\n\n")
              handle.write("| Target | Path | Download | Installed | Ratio |\n")
              handle.write("| --- | --- | ---: | ---: | ---: |\n")
              for target, path, download_size, payload_size, ratio in rows:
                  handle.write(
                      f"| {target} | `{path}` | {mib(download_size)} | "
                      f"{mib(payload_size)} | {ratio:.1f}% |\n"
                  )
              total_ratio = (total_download / total_payload * 100) if total_payload else 0
              handle.write(
                  f"| **Total** | | **{mib(total_download)}** | **{mib(total_payload)}** | "
                  f"**{total_ratio:.1f}%** |\n"
              )
          PY
      - name: Upload validated patch artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: output/patch/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
