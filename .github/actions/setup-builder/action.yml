name: Setup Astral Builder
description: Install Python and the production Builder dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: builder/pyproject.toml
    - shell: bash
      run: python -m pip install -e "$GITHUB_WORKSPACE/builder"
