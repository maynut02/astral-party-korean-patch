name: Setup database SSH tunnel
description: Forward a local PostgreSQL port on the GitHub runner to the private VM database port over SSH.

inputs:
  host:
    description: SSH server host
    required: true
  user:
    description: SSH server user
    required: true
  private-key:
    description: SSH private key
    required: true
  known-hosts:
    description: Pre-verified SSH known_hosts entry
    required: true
  local-port:
    description: Local PostgreSQL port on the runner
    required: false
    default: '55432'
  remote-host:
    description: PostgreSQL host as seen from the SSH server
    required: false
    default: '127.0.0.1'
  remote-port:
    description: PostgreSQL port as seen from the SSH server
    required: false
    default: '5433'

runs:
  using: composite
  steps:
    - name: Start SSH tunnel
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        SSH_PRIVATE_KEY: ${{ inputs.private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        LOCAL_PORT: ${{ inputs.local-port }}
        REMOTE_HOST: ${{ inputs.remote-host }}
        REMOTE_PORT: ${{ inputs.remote-port }}
      run: |
        set -euo pipefail
        install -d -m 0700 ~/.ssh
        key_file="$RUNNER_TEMP/astral-db-ssh-key"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
        chmod 0600 "$key_file"
        printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        chmod 0600 ~/.ssh/known_hosts

        ssh \
          -i "$key_file" \
          -o BatchMode=yes \
          -o ExitOnForwardFailure=yes \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=3 \
          -fNT \
          -L "${LOCAL_PORT}:${REMOTE_HOST}:${REMOTE_PORT}" \
          "${SSH_USER}@${SSH_HOST}"

        for attempt in $(seq 1 30); do
          if (echo > "/dev/tcp/127.0.0.1/${LOCAL_PORT}") >/dev/null 2>&1; then
            echo "Database SSH tunnel is ready on 127.0.0.1:${LOCAL_PORT}"
            exit 0
          fi
          sleep 1
        done

        echo "Database SSH tunnel did not become ready" >&2
        exit 1
