[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "astral-party-builder"
version = "0.1.0"
description = "GitHub Actions builder for the Astral Party Korean patch"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MayNut" }]
dependencies = [
  "UnityPy==1.25.2",
  "psycopg[binary]>=3.2,<4",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
astral-builder = "astral_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astral_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
