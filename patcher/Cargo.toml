[package]
name = "astral-auto-patcher"
version = "0.2.0"
edition = "2024"

[lib]
name = "astral_auto_patcher"
path = "src/lib.rs"

[[bin]]
name = "AstralAutoPatcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
